openapi: 3.0.3
info:
  title: Africa 2060 Institutional Enquiry API
  version: 1.0.0
  description: Public enquiry and protected operational API for Africa 2060.
servers:
  - url: https://YOUR_PRODUCTION_HOST
paths:
  /api/health:
    get:
      summary: Service readiness
      responses:
        '200': {description: Ready}
        '503': {description: Dependency unavailable}
  /api/investment-enquiries:
    post:
      summary: Submit an investment enquiry
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvestmentEnquiry'}
      responses: {'201': {description: Received}, '422': {description: Validation error}, '429': {description: Rate limited}}
  /api/partner-enquiries:
    post:
      summary: Submit a partner enquiry
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PartnerEnquiry'}
      responses: {'201': {description: Received}, '422': {description: Validation error}, '429': {description: Rate limited}}
  /api/contact:
    post:
      summary: Submit a general contact enquiry
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContactEnquiry'}
      responses: {'201': {description: Received}, '422': {description: Validation error}, '429': {description: Rate limited}}

  /api/admin/metrics:
    get:
      summary: Read protected operational metrics
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Metrics returned}
        '401': {description: Unauthorized}
  /api/admin/retention:
    post:
      summary: Inspect or apply configured retention
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: X-Retention-Dry-Run
          schema: {type: string, enum: ['true', 'false']}
      responses:
        '200': {description: Retention operation completed}
        '401': {description: Unauthorized}

  /api/admin/enquiries:
    get:
      summary: List enquiries
      security: [{bearerAuth: []}]
      responses: {'200': {description: Enquiries}, '401': {description: Unauthorized}}
  /api/admin/enquiries/{id}:
    patch:
      summary: Update enquiry status
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [received, reviewing, closed, spam]}
      responses: {'200': {description: Updated}, '401': {description: Unauthorized}, '404': {description: Not found}}
  /api/admin/enquiries/{id}/events:
    get:
      summary: List audit events for an enquiry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200': {description: Audit events}
        '401': {description: Unauthorized}

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: {type: string, maxLength: 100}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    Base:
      type: object
      required: [name, email, message]
      properties:
        name: {type: string, maxLength: 120}
        organisation: {type: string, maxLength: 160}
        email: {type: string, format: email}
        country: {type: string, maxLength: 100}
        message: {type: string, maxLength: 5000}
    InvestmentEnquiry:
      allOf:
        - {$ref: '#/components/schemas/Base'}
        - type: object
          required: [organisation]
          properties:
            interest: {type: string, maxLength: 200}
            investment_interest: {type: string, maxLength: 300}
    PartnerEnquiry:
      allOf:
        - {$ref: '#/components/schemas/Base'}
        - type: object
          required: [organisation, partner_type]
          properties:
            partner_type: {type: string, enum: [Investors, Corporate Partners, Sponsors & Foundations, Institutions]}
            interest: {type: string, maxLength: 200}
            contribution: {type: array, maxItems: 6, items: {type: string}}
    ContactEnquiry:
      $ref: '#/components/schemas/Base'
